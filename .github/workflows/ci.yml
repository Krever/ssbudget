name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # One sbt start for all of it. `e2e` is not in the root aggregate (a plain `sbt test` must not start Chrome), so its format check and its compile are named. The last two tasks are the
      # release path of build.sh, so a release that cannot build fails here and not on the day of a deploy.
      - name: Format check, compile, backend tests, release artifacts
        run: sbt scalafmtCheckAll scalafmtSbtCheck e2e/scalafmtCheckAll Test/compile e2e/Test/compile unitTests backend/stage frontend/fullLinkJS

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite, release mode)
        working-directory: frontend
        run: npm run build

      - name: Build the image (without Metabase)
        run: |
          git rev-parse --short HEAD > docker/VERSION
          docker build --build-arg WITH_ANALYTICS=false -t ssbudget:ci .

  # The browser tests. They are a gate: a failure fails the run.
  # They start after `build`, not beside it: `build` then has saved the sbt cache, and two jobs do not download the same files at one
  # time (a run failed on HTTP 429 from Maven Central that way, with no test run at all).
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The downloads and the compile, with a second and a third try: a repository that refuses a download must not fail the run.
      # The tests themselves run one time only, so a test that fails now and then stays visible.
      - name: Compile the browser tests
        run: |
          for attempt in 1 2 3; do
            sbt e2e/Test/compile && exit 0
            echo "Attempt $attempt failed; waiting before the next one"
            sleep 30
          done
          exit 1

      - name: Browser tests
        run: sbt e2e/test
